# Static checks, unit tests, backend integration tests, and a production build for every push and PR.
# Playwright browser tests need the full Compose stack and still run locally (see docs/local-operations.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mablog
          POSTGRES_PASSWORD: mablog-ci
          # conftest.py refuses to reset any database whose name does not end in mablog_test.
          POSTGRES_DB: mablog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mablog -d mablog_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://mablog:mablog-ci@localhost:5432/mablog_test
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Formatting
        run: ruff format --check app tests
      - name: Migrations apply, roll back, and reapply
        run: |
          alembic upgrade head
          alembic downgrade 0005
          alembic upgrade head
      - name: Integration tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Function documentation audit
        run: npm run audit:comments
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
